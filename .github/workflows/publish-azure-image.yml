name: Publish Azure container image

on:
  push:
    branches:
      - Aegyog-edits
  workflow_dispatch:

concurrency:
  group: publish-azure-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the deployment branch
        uses: actions/checkout@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish the verified Linux image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jaycenn/huffmanv7:azure
            ghcr.io/jaycenn/huffmanv7:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Jaycenn/HuffmanV7
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
